name: NAFS automated OMR batch audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    paths:
      - 'scripts/nafs-omr-batch-dry-run.py'
      - '.github/workflows/nafs-omr-batch-audit.yml'
permissions:
  contents: read
concurrency:
  group: nafs-omr-batch-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: pip install google-api-python-client google-auth pymupdf
      - name: Read real answer sheets with existing OMR, never update grades
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NAFS_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.NAFS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAFS_SUPABASE_SERVICE_ROLE_KEY }}
          NAFS_BATCH_LIMIT: '100'
        run: python scripts/nafs-omr-batch-dry-run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nafs-omr-batch-audit
          path: reports/nafs-real-omr-sample.json
          retention-days: 7
