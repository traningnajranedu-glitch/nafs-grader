name: NAFS automated OMR batch audit
# Manual full-correction request: run verified OMR audit; grade writes remain disabled until answer-key mapping is validated.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    paths:
      - 'scripts/nafs-omr-batch-dry-run.py'
      - 'scripts/nafs-run-real-omr.cjs'
      - 'scripts/nafs-scoring-policy.cjs'
      - 'scripts/nafs-scoring-eligibility.py'
      - 'scripts/nafs-omr-slot-diagnostics.py'
      - 'scripts/nafs-provisional-reference-score.py'
      - 'tests/nafs-scoring-policy.test.cjs'
      - '.github/workflows/nafs-omr-batch-audit.yml'
permissions:
  contents: read
concurrency:
  group: nafs-omr-batch-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify scoring policy
        run: node tests/nafs-scoring-policy.test.cjs
      - run: pip install google-api-python-client google-auth pymupdf
      - name: Read real answer sheets with existing OMR, never update grades
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NAFS_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.NAFS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAFS_SUPABASE_SERVICE_ROLE_KEY }}
          NAFS_BATCH_LIMIT: '100'
        run: python scripts/nafs-omr-batch-dry-run.py
      - name: Verify per-row scoring eligibility
        if: always()
        run: |
          if [ -f reports/nafs-real-omr-sample.json ]; then python scripts/nafs-scoring-eligibility.py; fi
      - name: Diagnose OMR question layout
        if: always()
        run: |
          if [ -f reports/nafs-real-omr-sample.json ]; then python scripts/nafs-omr-slot-diagnostics.py; fi
      - name: Calculate provisional reference comparisons
        if: always()
        run: |
          if [ -f reports/nafs-real-omr-sample.json ]; then python scripts/nafs-provisional-reference-score.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nafs-omr-batch-audit
          path: |
            reports/nafs-real-omr-sample.json
            reports/nafs-scoring-eligibility.json
            reports/nafs-omr-slot-diagnostics.json
            reports/nafs-provisional-reference-scores.json
            reports/layout-samples/*.png
          retention-days: 7
