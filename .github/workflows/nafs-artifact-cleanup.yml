name: Remove temporary OMR layout artifact
on:
  push:
    paths:
      - '.github/workflows/nafs-artifact-cleanup.yml'
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artifactId = 13302990299;
            let artifact = null;
            try {
              const response = await github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
              artifact = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (artifact) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
              core.info('Deleted temporary layout artifact.');
            } else {
              core.info('Temporary layout artifact was already absent.');
            }
