name: NAFS verified integrity audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nafs-verified-integrity.py'
      - '.github/workflows/nafs-verified-integrity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect verified records and question totals (read-only)
        env:
          SUPABASE_URL: ${{ secrets.NAFS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAFS_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/nafs-verified-integrity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nafs-verified-integrity
          path: reports/nafs-verified-integrity.json
          retention-days: 14
