name: OMR engine checks
on:
  push:
    branches: [main]
    paths: ['lib/**', 'tests/**', 'package*.json', '.github/workflows/omr-engine-checks.yml']
  pull_request:
    paths: ['lib/**', 'tests/**', 'package*.json', '.github/workflows/omr-engine-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
